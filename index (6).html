<title>مكتبتي الجامعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Markazi+Text:wght@400;500;600&family=Readex+Pro:wght@300;400;500&display=swap">
<style>
  /* Layout: editorial single page. Sticky quiet nav, asymmetric hero with arched panels, category tiles, upload strip, then the books as a hairline-ruled grid. */
  :root {
    --font-display: 'Cormorant Garamond', 'Markazi Text', 'Traditional Arabic', serif;
    --font-ui: 'DM Sans', 'Readex Pro', 'Segoe UI', Tahoma, sans-serif;

    --bg: #F8F6F1;
    --surface: #FDFCF9;
    --cream: #F0EAE1;
    --ink: #292923;
    --ink-soft: #6C6A5E;
    --line: #E2DBCE;
    --olive: #414538;
    --olive-ink: #F8F6F1;
    --sage-soft: #E4E8DC;
    --danger: #9E3F3A;
    --danger-soft: #F4DEDA;
    --scrim: rgba(41, 41, 35, .28);
    --edge: rgba(41, 41, 35, .14);
    --edge2: rgba(41, 41, 35, .2);
    --spine: rgba(41, 41, 35, .06);
    --tex: rgba(255, 255, 255, .22);
    --pop: 0 14px 30px rgba(41, 41, 35, .08);
    --pop-lg: 0 24px 50px rgba(41, 41, 35, .16);
    --lift: 0 14px 26px rgba(41, 41, 35, .12);

    --k0: #D9D1C3;
    --k1: #B8C1AE;
    --k2: #B8AA9B;
    --k3: #D8BFAE;
    --k4: #C5CEC9;
    --k5: #DCCFA9;
    --k6: #CDBBBF;
    --k7: #A9B08E;
    --k8: #CFC6B8;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1B1C17;
    --surface: #23251E;
    --cream: #2B2D24;
    --ink: #ECE8DD;
    --ink-soft: #A7A596;
    --line: #3A3C31;
    --olive: #B8C1AE;
    --olive-ink: #1B1C17;
    --sage-soft: #2F3328;
    --danger: #E08C84;
    --danger-soft: #3C2522;
    --scrim: rgba(0, 0, 0, .55);
    --edge: rgba(236, 232, 221, .16);
    --edge2: rgba(236, 232, 221, .22);
    --spine: rgba(0, 0, 0, .22);
    --tex: rgba(255, 255, 255, .04);
    --pop: 0 14px 30px rgba(0, 0, 0, .4);
    --pop-lg: 0 24px 50px rgba(0, 0, 0, .5);
    --lift: 0 14px 26px rgba(0, 0, 0, .45);

    --k0: #4B4A41;
    --k1: #56604F;
    --k2: #6B5F52;
    --k3: #7A6253;
    --k4: #4F5B58;
    --k5: #75683F;
    --k6: #695A5E;
    --k7: #626A47;
    --k8: #5C574D;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  html { scroll-behavior: auto; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.75;
    direction: rtl;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; border-radius: 4px; }
  svg { display: block; flex: none; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .shell { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 104px; }
  .k0 { --kc: var(--k0); } .k1 { --kc: var(--k1); } .k2 { --kc: var(--k2); } .k3 { --kc: var(--k3); }
  .k4 { --kc: var(--k4); } .k5 { --kc: var(--k5); } .k6 { --kc: var(--k6); } .k7 { --kc: var(--k7); } .k8 { --kc: var(--k8); }
  section[id] { scroll-margin-top: 84px; }

  .eyebrow { margin: 0; font-family: var(--font-ui); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); direction: ltr; text-align: start; }
  [dir="rtl"] .eyebrow { text-align: right; }

  /* Navigation */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-block: 16px; background: transparent; border-bottom: 1px solid transparent; transition: background .3s ease, border-color .3s ease;
  }
  .nav.scrolled { background: var(--bg); border-bottom-color: var(--line); }
  .brand .logo { width: 38px; height: 38px; align-self: center; }
  .brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: start; }
  .brand b { font-family: var(--font-display); font-weight: 500; font-size: 34px; line-height: 1; }
  .brand small { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-soft); }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-links { display: flex; align-items: center; gap: 28px; margin: 0; padding: 0; list-style: none; }
  .nav-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; background: none; border: 0; color: var(--ink); font-size: 14px;
    background-image: linear-gradient(var(--ink), var(--ink)); background-repeat: no-repeat; background-position: right bottom; background-size: 0 1px; transition: background-size .3s ease;
  }
  .nav-link:hover, .dd.open > .nav-link { background-size: 100% 1px; }
  .nav-link .ico { width: 14px; height: 14px; transition: transform .25s; }
  .dd { position: relative; }
  .dd.open > .nav-link .ico { transform: rotate(180deg); }
  .dd-menu {
    position: absolute; top: calc(100% + 12px); inset-inline-start: -14px; min-width: 220px; max-height: 60vh; overflow-y: auto; padding: 8px; display: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--pop);
  }
  .dd.open .dd-menu { display: block; }
  .dd-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; background: none; border: 0; border-radius: 4px; text-align: start; font-size: 14px; }
  .dd-item:hover { background: var(--cream); }
  .dd-item .n { margin-inline-start: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--kc, var(--k0)); box-shadow: 0 0 0 1px var(--edge); flex: none; }
  .burger { display: none; width: 40px; height: 40px; place-items: center; background: none; border: 1px solid var(--line); border-radius: 50%; }
  .theme { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; background: none; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); transition: background .25s, border-color .25s; }
  .theme:hover { background: var(--cream); border-color: var(--ink); }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 24px;
    background: var(--olive); color: var(--olive-ink); border: 1px solid var(--olive); border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    transition: background .25s, color .25s, transform .15s;
  }
  .btn:hover { background: transparent; color: var(--olive); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn.ghost:hover { background: var(--ink); color: var(--bg); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover { background: transparent; color: var(--danger); }
  .btn.small { min-height: 36px; padding: 4px 18px; font-size: 13px; }
  .textlink { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; background: none; border: 0; border-bottom: 1px solid var(--ink); color: var(--ink); font-size: 14px; }
  .textlink:hover { color: var(--olive); border-color: var(--olive); }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: center; padding-top: 28px; }
  .hero-text { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .hero h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(42px, 6vw, 74px); line-height: 1.12; text-wrap: balance; }
  .hero h1 em { font-style: normal; color: var(--olive); }
  .hero-lead { margin: 0; max-width: 44ch; color: var(--ink-soft); font-size: 16px; }
  .hero-actions { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }
  .figures { display: flex; gap: 0; margin-top: 18px; border-top: 1px solid var(--line); }
  .fig { display: flex; flex-direction: column; padding: 16px 0 0; padding-inline-end: 34px; margin-inline-end: 34px; border-inline-end: 1px solid var(--line); }
  .fig:last-child { border-inline-end: 0; margin-inline-end: 0; padding-inline-end: 0; }
  .fig b { font-family: var(--font-display); font-size: 40px; font-weight: 500; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
  .fig span { font-size: 12px; color: var(--ink-soft); }

  .arches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
  .arch {
    display: flex; align-items: flex-end; justify-content: center; padding: 0 12% 7%;
    background: var(--cream); border: 1px solid var(--line); border-radius: 999px 999px 4px 4px; overflow: hidden;
  }
  .arch:nth-child(1) { aspect-ratio: 3 / 5.1; background: color-mix(in srgb, var(--k1) 38%, var(--bg)); }
  .arch:nth-child(2) { aspect-ratio: 3 / 6.1; background: var(--cream); }
  .arch:nth-child(3) { aspect-ratio: 3 / 4.4; background: color-mix(in srgb, var(--k3) 42%, var(--bg)); }
  .arch .cover { width: 100%; }

  /* Covers */
  .cover {
    container-type: inline-size; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; text-align: center;
    aspect-ratio: 3 / 4; padding: 14px 16px 12px 12px; color: var(--ink); text-decoration: none;
    background: repeating-linear-gradient(0deg, var(--tex) 0 1px, transparent 1px 4px), var(--kc, var(--k0));
    border: 1px solid var(--edge); border-radius: 2px;
    box-shadow: inset -7px 0 0 var(--spine), 0 1px 2px var(--spine);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .cover::before { content: ""; position: absolute; inset: 7px 13px 7px 7px; border: 1px solid var(--edge2); pointer-events: none; }
  a.cover:hover { transform: translateY(-5px); box-shadow: inset -7px 0 0 var(--spine), var(--lift); }
  .cover-cat { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; opacity: .75; padding-top: 4px; }
  .cover-title {
    font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 14cqw, 34px); line-height: 1.35; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cover-mark { opacity: .6; padding-bottom: 2px; }
  .cover-mark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.2; }

  /* Section heads */
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 28px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .sec-title { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .sec-title h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(34px, 4.4vw, 52px); line-height: 1.15; text-wrap: balance; }
  .sec-title p { margin: 0; color: var(--ink-soft); }
  .sec-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .block { display: flex; flex-direction: column; gap: 34px; }

  /* Category tiles */
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .catcard {
    position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; min-height: 190px; padding: 22px 22px 20px; text-align: start;
    background: color-mix(in srgb, var(--kc, var(--k0)) 34%, var(--bg)); border: 1px solid var(--line); border-radius: 4px; color: var(--ink);
    transition: background .35s ease, border-color .35s ease;
  }
  .catcard:hover { background: color-mix(in srgb, var(--kc, var(--k0)) 62%, var(--bg)); border-color: color-mix(in srgb, var(--kc, var(--k0)) 80%, var(--ink)); }
  .catcard .name { font-family: var(--font-display); font-weight: 500; font-size: 38px; line-height: 1.15; overflow-wrap: anywhere; }
  .catcard .foot { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }
  .catcard .ico { transition: transform .3s ease; }
  .catcard:hover .ico { transform: translateX(-5px); }
  .catcard.add { background: transparent; border-style: dashed; color: var(--olive); justify-content: center; align-items: center; gap: 10px; }
  .catcard.add:hover { background: var(--sage-soft); border-color: var(--olive); }
  .catcard.add .name { font-size: 30px; }
  .note { margin: 0; color: var(--ink-soft); }

  /* Upload */
  .drop {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; align-items: center; padding: 30px 32px;
    background: var(--cream); border: 1px dashed color-mix(in srgb, var(--ink) 30%, var(--bg)); border-radius: 4px; transition: background .25s, border-color .25s;
  }
  .drop.over { background: var(--sage-soft); border-color: var(--olive); }
  .drop-text strong { display: block; font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.2; }
  .drop-text span { color: var(--ink-soft); font-size: 14px; }
  .drop-ctrl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .select { height: 42px; padding-inline: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; max-width: 100%; }
  #uploads { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  #uploads:empty { display: none; }
  .up { display: flex; justify-content: space-between; gap: 14px; padding: 9px 14px; background: var(--cream); border-radius: 4px; font-size: 13px; }
  .up-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: end; }
  .up-state { white-space: nowrap; color: var(--ink-soft); }
  .up:not(.ok):not(.bad) .up-state { animation: pulse 1.4s ease-in-out infinite; }
  .up.ok .up-state { color: var(--olive); font-weight: 500; }
  .up.bad { background: var(--danger-soft); cursor: pointer; }
  .up.bad .up-state { color: var(--danger); white-space: normal; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* Books */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px 32px; flex-wrap: wrap; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px 26px; }
  .filter { padding: 6px 0; background: none; border: 0; border-bottom: 1px solid transparent; color: var(--ink-soft); font-size: 14px; transition: color .2s, border-color .2s; }
  .filter:hover { color: var(--ink); }
  .filter[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .filter .n { margin-inline-start: 6px; font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .search { position: relative; flex: 0 1 260px; min-width: 180px; }
  .search .ico { position: absolute; top: 50%; inset-inline-start: 2px; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .search input { width: 100%; height: 42px; padding-inline: 30px 4px; background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus-visible { outline: none; border-bottom-width: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 46px 28px; }
  .item { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .item-title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .item-meta { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tools { position: absolute; top: 8px; inset-inline-start: 8px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transition: opacity .2s; }
  .item:hover .tools, .item:focus-within .tools { opacity: 1; }
  @media (hover: none) { .tools { opacity: 1; } }
  .tool { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; color: var(--ink); }
  .tool:hover { border-color: var(--ink); }
  .tool.del:hover { color: var(--danger); border-color: var(--danger); }
  .tool .ico { width: 14px; height: 14px; }
  .empty { padding: 56px 24px; text-align: center; background: var(--cream); border-radius: 4px; color: var(--ink-soft); }
  .empty h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 500; font-size: 34px; color: var(--ink); }
  .empty p { margin: 0 auto; max-width: 46ch; }

  /* Footer */
  .foot-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px 32px; flex-wrap: wrap; padding-top: 28px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; }
  .foot-bar ul { display: flex; gap: 26px; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
  .foot-bar button { padding: 0; background: none; border: 0; color: inherit; font-size: 13px; }
  .foot-bar button:hover { color: var(--ink); }

  /* Modal */
  .scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: var(--scrim); }
  .sheet { width: min(440px, 100%); display: flex; flex-direction: column; gap: 18px; padding: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--pop-lg); }
  .sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 36px; line-height: 1.2; }
  .sheet-text { margin: 0; color: var(--ink-soft); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .lbl { font-size: 13px; color: var(--ink-soft); }
  .field input[type="text"], .field select { height: 44px; padding-inline: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); background: var(--kc); padding: 0; box-shadow: 0 0 0 1px var(--line); }
  .sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .err { margin: 0; color: var(--danger); font-size: 13px; }
  .sheet-actions { display: flex; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: minmax(0, 1fr); gap: 44px; }
    .arches { max-width: 460px; }
    .drop { grid-template-columns: minmax(0, 1fr); padding: 24px 22px; }
  }
  @media (max-width: 760px) {
    .shell { gap: 80px; }
    .burger { display: grid; }
    .nav-right { gap: 12px; }
    .nav-links {
      position: absolute; top: 100%; inset-inline: 0; display: none; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 4px 18px;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .nav.open .nav-links { display: flex; }
    .nav.open { background: var(--bg); border-bottom-color: transparent; }
    .dd { width: 100%; }
    .dd-menu { position: static; display: none; min-width: 0; max-height: none; margin-top: 8px; box-shadow: none; }
    .brand b { font-size: 30px; }
    .brand small { display: none; }
    .figures .fig { padding-inline-end: 22px; margin-inline-end: 22px; }
    .fig b { font-size: 34px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 36px 18px; }
    .catcard { min-height: 160px; }
    .search { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell" lang="ar" dir="rtl">
  <header class="nav" id="nav">
    <button type="button" class="brand" id="brand" aria-label="العودة إلى أعلى الصفحة"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect x="21" y="36" width="13" height="44" rx="1.5" fill="var(--ink)"/><rect x="21" y="44" width="13" height="2" fill="var(--bg)"/><rect x="21" y="70" width="13" height="2" fill="var(--bg)"/><rect x="36" y="26" width="13" height="54" rx="1.5" fill="#B8C1AE"/><rect x="36" y="34" width="13" height="2" fill="var(--ink)"/><rect x="36" y="66" width="13" height="2" fill="var(--ink)"/><rect x="51" y="40" width="13" height="40" rx="1.5" fill="#B8AA9B"/><rect x="51" y="48" width="13" height="2" fill="var(--ink)"/><rect x="66" y="33" width="13" height="47" rx="1.5" fill="var(--ink)" transform="rotate(9 72 80)"/><rect x="15" y="80" width="70" height="3.4" rx="1.4" fill="var(--ink)"/></svg><b>مكتبتي</b><small>Library</small></button>
    <div class="nav-right">
      <ul class="nav-links" id="navLinks">
        <li class="dd" id="dd">
          <button type="button" class="nav-link" id="ddBtn" aria-expanded="false" aria-haspopup="true">التصنيفات<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="dd-menu" id="ddMenu"></div>
        </li>
        <li><button type="button" class="nav-link" data-go="books">الكتب</button></li>
        <li id="navAddLi"><button type="button" class="nav-link" data-go="add">إضافة</button></li>
      </ul>
      <button type="button" class="btn small" id="navAction" hidden>أضف كتابًا</button>
      <button type="button" class="theme" id="themeBtn" aria-label="التبديل بين الوضع الفاتح والداكن" title="الوضع الفاتح / الداكن">
        <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
        <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      </button>
      <button type="button" class="burger" id="burger" aria-label="القائمة" aria-expanded="false" aria-controls="navLinks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></button>
    </div>
  </header>

  <section class="hero" id="top">
    <div class="hero-text">
      <p class="eyebrow">Personal library</p>
      <h1>كتبك الجامعية في مكان واحد، <em>هادئ ومرتّب</em></h1>
      <p class="hero-lead">ارفع كتبك ومراجعك بصيغة PDF، وصنّفها بحسب موادك، وارجع إليها متى احتجت.</p>
      <div class="hero-actions">
        <button type="button" class="btn" id="heroAction">تصفّح الكتب</button>
        <button type="button" class="textlink" data-go="cats">الأقسام<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      </div>
      <div class="figures" id="figures" aria-live="polite"></div>
    </div>
    <div class="arches" id="arches" aria-hidden="true"></div>
  </section>

  <section class="block" id="cats">
    <div class="sec-head">
      <div class="sec-title"><p class="eyebrow">Collections</p><h2>الأقسام</h2></div>
      <p class="note" id="catsNote"></p>
    </div>
    <div class="cats" id="catGrid"></div>
  </section>

  <section class="block" id="add" hidden>
    <div class="sec-head">
      <div class="sec-title"><p class="eyebrow">Add to library</p><h2>أضف إلى مكتبتك</h2></div>
    </div>
    <div>
      <div id="dropWrap"></div>
      <div id="uploads" aria-live="polite"></div>
    </div>
  </section>

  <section class="block" id="books">
    <div class="sec-head" id="bookHead"></div>
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="تصفية حسب التصنيف"></div>
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <label class="sr" for="q">ابحث في عناوين الكتب</label>
        <input id="q" type="search" placeholder="ابحث في العناوين" autocomplete="off">
      </div>
    </div>
    <div id="grid"></div>
  </section>

  <footer class="foot-bar">
    <span>مكتبتي · للقراءة والمراجعة</span>
    <ul>
      <li><button type="button" data-go="cats">الأقسام</button></li>
      <li><button type="button" data-go="books">الكتب</button></li>
      <li><button type="button" data-go="top">أعلى الصفحة</button></li>
    </ul>
  </footer>
</div>

<input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <h2 id="sheetTitle"></h2>
    <p class="sheet-text" id="sheetText" hidden></p>
    <div id="sheetFields"></div>
    <p class="err" id="sheetErr" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="submit" class="btn" id="sheetOk"></button>
      <button type="button" class="btn ghost" id="sheetCancel">إلغاء</button>
    </div>
  </form>
</div>

<script>
(function () {
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var norm = function (s) {
    return String(s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  };
  var AR = 'ar';
  var fmt = function (n) { return Number(n).toLocaleString(AR); };
  function plural(n, f) {
    if (n === 0) return f[0];
    if (n === 1) return f[1];
    if (n === 2) return f[2];
    return fmt(n) + ' ' + (n <= 10 ? f[3] : f[4]);
  }
  var BOOKS = ['لا كتب', 'كتاب واحد', 'كتابان', 'كتب', 'كتابًا'];

  var MAX_BYTES = 100 * 1024 * 1024;
  var ERR = {
    too_large: 'حجم الملف أكبر من ١٠٠ ميغابايت.',
    unsupported_type: 'يُقبل ملف PDF فقط.',
    QuotaExceededError: 'مساحة التخزين في المتصفح ممتلئة، احذف بعض الكتب ثم أعد المحاولة.',
    quota_exceeded: 'تجاوزت المكتبة حدّ التخزين.',
    rate_limited: 'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.',
    invalid_request: 'الملف فارغ أو غير صالح.',
    store_unavailable: 'الخدمة مشغولة الآن، أعد المحاولة.'
  };
  var errMsg = function (e) { return (e && (ERR[e.code] || ERR[e.name])) || 'تعذّر إتمام العملية، حاول مرة أخرى.'; };

  var ICON = {
    plus: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    upload: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 19h14"/></svg>',
    edit: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 2.8L7.8 18.8 4 20z"/></svg>',
    trash: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
    arrow: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    mark: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/><rect x="6" y="6" width="12" height="12" rx="1" transform="rotate(45 12 12)"/></svg>'
  };

  var state = {
    ready: false, failed: false, canEdit: false,
    cats: [], books: [], catsIn: false, booksIn: false,
    sel: 'all', q: '', uploadCat: ''
  };
  var db = null, assets = null;

  var colorOf = function (cat) { return cat ? (cat.color % 8) + 1 : 0; };
  var catById = function (id) { return state.cats.filter(function (c) { return c.id === id; })[0]; };
  var hasCat = function (id) { return !!id && !!catById(id); };
  var bookCat = function (b) { return hasCat(b.categoryId) ? b.categoryId : ''; };
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function go(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }

  function counts() {
    var c = { all: state.books.length, none: 0 };
    state.cats.forEach(function (x) { c[x.id] = 0; });
    state.books.forEach(function (b) {
      var id = bookCat(b);
      if (id) c[id]++; else c.none++;
    });
    return c;
  }

  /* ---------- Rendering ---------- */
  function coverHTML(it) {
    var inner = '<span class="cover-cat">' + esc(it.cat) + '</span><span class="cover-title">' + esc(it.title) + '</span><span class="cover-mark">' + ICON.mark + '</span>';
    if (it.href) return '<a class="cover k' + it.k + '" href="' + esc(it.href) + '" target="_blank" rel="noopener" aria-label="فتح ' + esc(it.title) + '">' + inner + '</a>';
    return '<div class="cover k' + it.k + '">' + inner + '</div>';
  }

  function renderHero() {
    var items = [];
    state.books.slice(0, 3).forEach(function (b) {
      var cat = catById(b.categoryId);
      items.push({ title: b.title, cat: cat ? cat.name : 'بدون تصنيف', k: colorOf(cat) });
    });
    state.cats.forEach(function (c) {
      if (items.length < 3 && !items.some(function (i) { return i.title === c.name; })) items.push({ title: c.name, cat: 'قسم', k: colorOf(c) });
    });
    var fallback = [{ title: 'فقه', cat: 'قسم', k: 1 }, { title: 'بلاغة', cat: 'قسم', k: 2 }, { title: 'جنايات', cat: 'قسم', k: 3 }];
    for (var i = 0; items.length < 3 && i < fallback.length; i++) {
      if (!items.some(function (x) { return x.title === fallback[i].title; })) items.push(fallback[i]);
    }
    $('#arches').innerHTML = items.slice(0, 3).map(function (it) { return '<div class="arch">' + coverHTML(it) + '</div>'; }).join('');
  }

  function renderFigures() {
    var el = $('#figures');
    if (!state.ready || state.failed) { el.innerHTML = ''; return; }
    var bytes = state.books.reduce(function (s, b) { return s + b.size; }, 0);
    var mb = bytes / 1048576;
    var size = mb >= 100 ? Math.round(mb) : Number(mb.toFixed(1));
    el.innerHTML =
      '<div class="fig"><b>' + fmt(state.books.length) + '</b><span>كتب</span></div>' +
      '<div class="fig"><b>' + fmt(state.cats.length) + '</b><span>تصنيفات</span></div>' +
      '<div class="fig"><b>' + fmt(size) + '</b><span>ميغابايت</span></div>';
  }

  function renderNav() {
    var c = counts();
    var h = '<button type="button" class="dd-item" data-sel="all">كل الكتب<span class="n">' + fmt(c.all) + '</span></button>';
    state.cats.forEach(function (cat) {
      h += '<button type="button" class="dd-item k' + colorOf(cat) + '" data-sel="' + esc(cat.id) + '"><span class="dot"></span>' + esc(cat.name) + '<span class="n">' + fmt(c[cat.id] || 0) + '</span></button>';
    });
    if (c.none > 0) h += '<button type="button" class="dd-item k0" data-sel="none"><span class="dot"></span>بدون تصنيف<span class="n">' + fmt(c.none) + '</span></button>';
    $('#ddMenu').innerHTML = h;
    var can = state.ready && state.canEdit;
    $('#navAction').hidden = !can;
    $('#navAddLi').hidden = !can;
    $('#add').hidden = !can;
    $('#heroAction').textContent = can ? 'أضف كتابًا' : 'تصفّح الكتب';
  }

  function renderCats() {
    var c = counts(), h = '';
    state.cats.forEach(function (cat) {
      h += '<button type="button" class="catcard k' + colorOf(cat) + '" data-pick="' + esc(cat.id) + '"><span class="name">' + esc(cat.name) + '</span>' +
        '<span class="foot"><span>' + esc(plural(c[cat.id] || 0, BOOKS)) + '</span>' + ICON.arrow + '</span></button>';
    });
    if (c.none > 0) h += '<button type="button" class="catcard k0" data-pick="none"><span class="name">بدون تصنيف</span><span class="foot"><span>' + esc(plural(c.none, BOOKS)) + '</span>' + ICON.arrow + '</span></button>';
    if (state.ready && state.canEdit) h += '<button type="button" class="catcard add" id="addCat">' + ICON.plus + '<span class="name">تصنيف جديد</span></button>';
    $('#catGrid').innerHTML = h;
    $('#catsNote').textContent = !state.ready ? '' : (state.cats.length === 0 ? (state.canEdit ? 'ابدأ بإنشاء أول تصنيف لموادك.' : 'لا توجد تصنيفات بعد.') : 'اختر قسمًا لعرض كتبه.');
  }

  function renderDrop() {
    var w = $('#dropWrap');
    if (!state.ready || !state.canEdit) { w.innerHTML = ''; return; }
    var cur = hasCat(state.uploadCat) ? state.uploadCat : '';
    var opts = state.cats.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (c.id === cur ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('') + '<option value=""' + (cur === '' ? ' selected' : '') + '>بدون تصنيف</option>';
    w.innerHTML = '<div class="drop" id="drop">' +
      '<div class="drop-text"><strong>أسقط ملفات PDF هنا</strong><span>أو اخترها من جهازك، بحد أقصى ١٠٠ ميغابايت للملف. تُحفظ الكتب داخل هذا المتصفح على جهازك.</span></div>' +
      '<div class="drop-ctrl"><label class="sr" for="uploadCat">إضافة إلى تصنيف</label>' +
      '<select class="select" id="uploadCat">' + opts + '</select>' +
      '<button type="button" class="btn" id="pick">' + ICON.upload + 'اختيار ملفات</button></div></div>';
  }

  function renderFilters() {
    var c = counts(), h = '';
    function f(key, name, n) {
      h += '<button type="button" class="filter" data-sel="' + esc(key) + '" aria-current="' + (state.sel === key) + '">' + esc(name) + '<span class="n">' + fmt(n) + '</span></button>';
    }
    f('all', 'الكل', c.all);
    state.cats.forEach(function (cat) { f(cat.id, cat.name, c[cat.id] || 0); });
    if (c.none > 0) f('none', 'بدون تصنيف', c.none);
    $('#filters').innerHTML = h;
  }

  function visibleBooks() {
    var q = norm(state.q.trim());
    return state.books.filter(function (b) {
      var id = bookCat(b);
      if (state.sel === 'none' && id) return false;
      if (state.sel !== 'all' && state.sel !== 'none' && id !== state.sel) return false;
      return !q || norm(b.title).indexOf(q) !== -1;
    });
  }

  function renderBookHead() {
    var cat = (state.sel !== 'all' && state.sel !== 'none') ? catById(state.sel) : null;
    var searching = !!state.q.trim();
    var title = searching ? 'نتائج البحث' : (state.sel === 'none' ? 'بدون تصنيف' : (cat ? cat.name : 'كل الكتب'));
    var total = visibleBooks().length;
    var sub = !state.ready ? '' : (searching && total === 0 ? 'لا نتائج مطابقة' : plural(total, BOOKS));
    var actions = (cat && state.canEdit && !searching)
      ? '<div class="sec-actions"><button type="button" class="btn ghost small" data-act="cat-edit">' + ICON.edit + 'تعديل التصنيف</button>' +
        '<button type="button" class="btn ghost small" data-act="cat-del">' + ICON.trash + 'حذف التصنيف</button></div>' : '';
    $('#bookHead').innerHTML = '<div class="sec-title"><p class="eyebrow">Shelf</p><h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p></div>' + actions;
  }

  function bookCard(b) {
    var cat = catById(b.categoryId);
    var k = colorOf(cat);
    var date = b.addedAt ? new Date(b.addedAt).toLocaleDateString(AR, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    var size = b.size ? Number(b.size / 1048576).toLocaleString(AR, { maximumFractionDigits: 1 }) + ' م.ب' : '';
    var tools = state.canEdit
      ? '<div class="tools"><button type="button" class="tool" data-act="book-edit" data-id="' + esc(b.id) + '" aria-label="تعديل ' + esc(b.title) + '">' + ICON.edit + '</button>' +
        '<button type="button" class="tool del" data-act="book-del" data-id="' + esc(b.id) + '" aria-label="حذف ' + esc(b.title) + '">' + ICON.trash + '</button></div>' : '';
    return '<article class="item">' +
      coverHTML({ title: b.title, cat: cat ? cat.name : 'بدون تصنيف', k: k, href: urlFor(b) }) + tools +
      '<h3 class="item-title">' + esc(b.title) + '</h3>' +
      '<div class="item-meta"><span>' + esc(cat ? cat.name : 'بدون تصنيف') + '</span><span>' + esc([size, date].filter(Boolean).join(' · ')) + '</span></div></article>';
  }

  function renderGrid() {
    var g = $('#grid');
    if (state.failed) { g.innerHTML = '<div class="empty"><h3>تعذّر فتح المكتبة</h3><p>لا يسمح المتصفح بحفظ الملفات هنا. أغلق وضع التصفح الخاص ثم أعد تحميل الصفحة.</p></div>'; return; }
    if (!state.ready) { g.innerHTML = '<div class="empty"><h3>لحظة من فضلك</h3><p>تُرتَّب الرفوف الآن.</p></div>'; return; }
    var list = visibleBooks();
    if (list.length === 0) {
      var msg;
      if (state.q.trim()) msg = ['لا نتائج', 'جرّب كلمة أخرى من عنوان الكتاب، أو امسح البحث لعرض كل الكتب.'];
      else if (state.books.length === 0) msg = ['المكتبة فارغة بعد', state.canEdit ? 'أضف ملفات PDF من قسم «أضف إلى مكتبتك» لتظهر هنا.' : 'لم تُضف كتب بعد.'];
      else msg = ['هذا القسم فارغ', state.canEdit ? 'أضف ملفات PDF إلى هذا التصنيف من قسم «أضف إلى مكتبتك».' : 'لا توجد كتب في هذا القسم.'];
      g.innerHTML = '<div class="empty"><h3>' + msg[0] + '</h3><p>' + msg[1] + '</p></div>';
      return;
    }
    g.innerHTML = '<div class="grid">' + list.map(bookCard).join('') + '</div>';
  }

  function renderBooksArea() { renderFilters(); renderBookHead(); renderGrid(); }
  function render() { renderHero(); renderFigures(); renderNav(); renderCats(); renderDrop(); renderBooksArea(); }

  /* ---------- Modal ---------- */
  var modal = null, lastFocus = null;
  function buildField(fd) {
    var d = document.createElement('div');
    d.className = 'field';
    if (fd.type === 'text') {
      d.innerHTML = '<label for="f_' + fd.id + '">' + esc(fd.label) + '</label><input type="text" id="f_' + fd.id + '" autocomplete="off" maxlength="120">';
      d.querySelector('input').value = fd.value || '';
    } else if (fd.type === 'select') {
      d.innerHTML = '<label for="f_' + fd.id + '">' + esc(fd.label) + '</label><select id="f_' + fd.id + '"></select>';
      var s = d.querySelector('select');
      fd.options.forEach(function (o) {
        var op = document.createElement('option');
        op.value = o.value; op.textContent = o.label;
        if (o.value === fd.value) op.selected = true;
        s.appendChild(op);
      });
    } else if (fd.type === 'swatch') {
      d.innerHTML = '<span class="lbl" id="l_' + fd.id + '">' + esc(fd.label) + '</span><input type="hidden" id="f_' + fd.id + '">' +
        '<div class="swatches" role="radiogroup" aria-labelledby="l_' + fd.id + '"></div>';
      var hid = d.querySelector('input'), box = d.querySelector('.swatches');
      hid.value = String(fd.value);
      for (var i = 0; i < 8; i++) {
        (function (i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'sw k' + (i + 1);
          b.setAttribute('role', 'radio'); b.setAttribute('aria-label', 'لون ' + fmt(i + 1));
          b.setAttribute('aria-checked', String(i === Number(fd.value)));
          b.addEventListener('click', function () {
            hid.value = String(i);
            box.querySelectorAll('.sw').forEach(function (x, j) { x.setAttribute('aria-checked', String(j === i)); });
          });
          box.appendChild(b);
        })(i);
      }
    }
    return d;
  }
  function openModal(cfg) {
    modal = cfg; lastFocus = document.activeElement;
    $('#sheetTitle').textContent = cfg.title;
    var t = $('#sheetText'); t.hidden = !cfg.text; t.textContent = cfg.text || '';
    var f = $('#sheetFields'); f.innerHTML = '';
    (cfg.fields || []).forEach(function (fd) { f.appendChild(buildField(fd)); });
    var ok = $('#sheetOk'); ok.textContent = cfg.confirm; ok.className = 'btn' + (cfg.danger ? ' danger' : ''); ok.disabled = false;
    $('#sheetErr').hidden = true;
    $('#scrim').hidden = false;
    var first = f.querySelector('input[type="text"],select');
    (first || $('#sheetCancel')).focus();
    if (first && first.select) first.select();
  }
  function closeModal() {
    $('#scrim').hidden = true; modal = null;
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }
  $('#sheet').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!modal) return;
    var vals = {}, bad = null;
    (modal.fields || []).forEach(function (fd) {
      var v = $('#f_' + fd.id).value;
      if (fd.type === 'text') v = v.trim();
      if (fd.required && !v) bad = fd.requiredMsg || 'هذا الحقل مطلوب.';
      vals[fd.id] = v;
    });
    var err = $('#sheetErr');
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    var ok = $('#sheetOk'); ok.disabled = true;
    try { await modal.onConfirm(vals); closeModal(); }
    catch (x) { err.textContent = errMsg(x); err.hidden = false; ok.disabled = false; }
  });
  $('#sheetCancel').addEventListener('click', closeModal);
  $('#scrim').addEventListener('mousedown', function (e) { if (e.target.id === 'scrim') closeModal(); });

  /* ---------- Category actions ---------- */
  function addCategory() {
    openModal({
      title: 'تصنيف جديد', confirm: 'إضافة',
      fields: [
        { id: 'name', type: 'text', label: 'اسم التصنيف', value: '', required: true, requiredMsg: 'اكتب اسم التصنيف.' },
        { id: 'color', type: 'swatch', label: 'اللون', value: state.cats.length % 8 }
      ],
      onConfirm: async function (v) {
        var id = uid();
        await Store.put('categories', { id: id, name: v.name, color: Number(v.color), order: Date.now() });
        await reload();
        state.sel = id; state.uploadCat = id;
        render();
      }
    });
  }
  function editCategory() {
    var cat = catById(state.sel); if (!cat) return;
    openModal({
      title: 'تعديل التصنيف', confirm: 'حفظ',
      fields: [
        { id: 'name', type: 'text', label: 'اسم التصنيف', value: cat.name, required: true, requiredMsg: 'اكتب اسم التصنيف.' },
        { id: 'color', type: 'swatch', label: 'اللون', value: cat.color % 8 }
      ],
      onConfirm: async function (v) { await Store.patch('categories', cat.id, { name: v.name, color: Number(v.color) }); await reload(); }
    });
  }
  function deleteCategory() {
    var cat = catById(state.sel); if (!cat) return;
    var n = state.books.filter(function (b) { return b.categoryId === cat.id; }).length;
    openModal({
      title: 'حذف «' + cat.name + '»', confirm: 'حذف التصنيف', danger: true,
      text: n > 0 ? 'يحتوي هذا التصنيف على ' + plural(n, BOOKS) + '. ستبقى الكتب في المكتبة تحت «بدون تصنيف».' : 'التصنيف فارغ ولن يتأثر أي كتاب.',
      onConfirm: async function () {
        var mine = state.books.filter(function (b) { return b.categoryId === cat.id; });
        for (var i = 0; i < mine.length; i++) await Store.patch('books', mine[i].id, { categoryId: '' });
        await Store.del('categories', cat.id);
        state.sel = 'all';
        await reload();
      }
    });
  }

  /* ---------- Book actions ---------- */
  function catOptions() {
    return state.cats.map(function (c) { return { value: c.id, label: c.name }; }).concat([{ value: '', label: 'بدون تصنيف' }]);
  }
  function editBook(id) {
    var b = state.books.filter(function (x) { return x.id === id; })[0]; if (!b) return;
    openModal({
      title: 'تعديل الكتاب', confirm: 'حفظ',
      fields: [
        { id: 'title', type: 'text', label: 'عنوان الكتاب', value: b.title, required: true, requiredMsg: 'اكتب عنوان الكتاب.' },
        { id: 'cat', type: 'select', label: 'التصنيف', value: bookCat(b), options: catOptions() }
      ],
      onConfirm: async function (v) { await Store.patch('books', b.id, { title: v.title, categoryId: v.cat }); await reload(); }
    });
  }
  function deleteBook(id) {
    var b = state.books.filter(function (x) { return x.id === id; })[0]; if (!b) return;
    openModal({
      title: 'حذف الكتاب', confirm: 'حذف نهائيًا', danger: true,
      text: 'سيُحذف «' + b.title + '» وملفه من المكتبة، ولا يمكن التراجع عن ذلك.',
      onConfirm: async function () {
        revoke(b.id);
        await Store.del('books', b.id);
        await reload();
      }
    });
  }

  /* ---------- Upload ---------- */
  function progressRow(name) {
    var el = document.createElement('div');
    el.className = 'up';
    el.innerHTML = '<span class="up-state">جارٍ الرفع…</span><span class="up-name"></span>';
    el.querySelector('.up-name').textContent = name;
    $('#uploads').appendChild(el);
    var st = el.querySelector('.up-state');
    return {
      ok: function () { el.classList.add('ok'); st.textContent = 'تمت الإضافة'; setTimeout(function () { el.remove(); }, 3500); },
      fail: function (m) { el.classList.add('bad'); st.textContent = m; el.title = 'اضغط للإخفاء'; el.addEventListener('click', function () { el.remove(); }); }
    };
  }
  async function uploadFiles(files, catId) {
    var list = Array.prototype.slice.call(files);
    for (var i = 0; i < list.length; i++) {
      var f = list[i], row = progressRow(f.name);
      try {
        if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') throw { code: 'unsupported_type' };
        if (f.size > MAX_BYTES) throw { code: 'too_large' };
        await Store.put('books', {
          id: uid(),
          title: f.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').trim() || 'كتاب بلا عنوان',
          fileName: f.name, categoryId: hasCat(catId) ? catId : '',
          blob: f, size: f.size, addedAt: Date.now()
        });
        await reload();
        row.ok();
      } catch (e) { row.fail(errMsg(e)); }
    }
  }

  /* ---------- Events ---------- */
  var THEME_KEY = 'library-theme';
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
  var theme = 'light';
  try { var saved = localStorage.getItem(THEME_KEY); if (saved === 'dark' || saved === 'light') theme = saved; } catch (e) {}
  applyTheme(theme);
  $('#themeBtn').addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  });

  var nav = $('#nav'), dd = $('#dd'), burger = $('#burger');
  function closeMenus() {
    dd.classList.remove('open'); $('#ddBtn').setAttribute('aria-expanded', 'false');
    $('#ddMenu').style.display = '';
    nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
  }
  function select(key, scroll) {
    state.sel = key;
    if (hasCat(key)) state.uploadCat = key;
    render();
    if (scroll) go('books');
  }
  function openPicker() { var p = $('#fileIn'); if (p) p.click(); }

  window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });
  $('#brand').addEventListener('click', function () { closeMenus(); go('top'); });
  burger.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    burger.setAttribute('aria-expanded', String(open));
    if (!open) closeMenus();
  });
  $('#ddBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = dd.classList.toggle('open');
    $('#ddBtn').setAttribute('aria-expanded', String(open));
    $('#ddMenu').style.display = open ? 'block' : '';
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#dd') && !e.target.closest('.burger')) {
      dd.classList.remove('open'); $('#ddBtn').setAttribute('aria-expanded', 'false'); $('#ddMenu').style.display = '';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (modal) closeModal(); else closeMenus();
  });
  $('#ddMenu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sel]'); if (!b) return;
    closeMenus(); select(b.getAttribute('data-sel'), true);
  });
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { closeMenus(); go(g.getAttribute('data-go')); }
  });
  $('#navAction').addEventListener('click', function () { closeMenus(); go('add'); });
  $('#heroAction').addEventListener('click', function () { go(state.canEdit ? 'add' : 'books'); });
  $('#catGrid').addEventListener('click', function (e) {
    if (e.target.closest('#addCat')) { addCategory(); return; }
    var p = e.target.closest('[data-pick]'); if (p) select(p.getAttribute('data-pick'), true);
  });
  $('#filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sel]'); if (b) select(b.getAttribute('data-sel'), false);
  });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; renderBookHead(); renderGrid(); });
  $('#bookHead').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'cat-edit') editCategory();
    if (b.dataset.act === 'cat-del') deleteCategory();
  });
  $('#grid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'book-edit') editBook(b.dataset.id);
    if (b.dataset.act === 'book-del') deleteBook(b.dataset.id);
  });
  var dropWrap = $('#dropWrap');
  dropWrap.addEventListener('click', function (e) { if (e.target.closest('#pick')) openPicker(); });
  dropWrap.addEventListener('change', function (e) { if (e.target.id === 'uploadCat') state.uploadCat = e.target.value; });
  dropWrap.addEventListener('dragover', function (e) { e.preventDefault(); var d = $('#drop'); if (d) d.classList.add('over'); });
  dropWrap.addEventListener('dragleave', function (e) { if (!dropWrap.contains(e.relatedTarget)) { var d = $('#drop'); if (d) d.classList.remove('over'); } });
  dropWrap.addEventListener('drop', function (e) {
    e.preventDefault();
    var d = $('#drop'); if (d) d.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, state.uploadCat);
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
  $('#fileIn').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = '';
    if (files.length) uploadFiles(files, state.uploadCat);
  });

  /* ---------- Data (stored on this device, in the browser) ---------- */
  var Store = (function () {
    var dbp = null;
    function open() {
      if (!dbp) dbp = new Promise(function (res, rej) {
        var r = indexedDB.open('university-library', 1);
        r.onupgradeneeded = function () {
          var d = r.result;
          d.createObjectStore('categories', { keyPath: 'id' });
          d.createObjectStore('books', { keyPath: 'id' });
        };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
      return dbp;
    }
    function run(store, mode, fn) {
      return open().then(function (d) {
        return new Promise(function (res, rej) {
          var t = d.transaction(store, mode), out = fn(t.objectStore(store));
          t.oncomplete = function () { res(out && 'result' in out ? out.result : undefined); };
          t.onerror = t.onabort = function () { rej(t.error || (out && out.error)); };
        });
      });
    }
    return {
      open: open,
      all: function (store) { return run(store, 'readonly', function (st) { return st.getAll(); }); },
      put: function (store, o) { return run(store, 'readwrite', function (st) { return st.put(o); }); },
      del: function (store, id) { return run(store, 'readwrite', function (st) { return st.delete(id); }); },
      patch: function (store, id, fields) {
        return run(store, 'readwrite', function (st) {
          var g = st.get(id);
          g.onsuccess = function () { if (g.result) st.put(Object.assign(g.result, fields)); };
          return g;
        });
      }
    };
  })();

  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
  var blobs = {}, urls = {};
  function urlFor(b) {
    if (!urls[b.id] && blobs[b.id]) urls[b.id] = URL.createObjectURL(blobs[b.id].slice(0, blobs[b.id].size, 'application/pdf'));
    return urls[b.id] || '#';
  }
  function revoke(id) { if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; } delete blobs[id]; }

  async function reload() {
    var cats = await Store.all('categories'), books = await Store.all('books');
    cats.sort(function (x, y) { return (x.order || 0) - (y.order || 0); });
    books.sort(function (x, y) { return (y.addedAt || 0) - (x.addedAt || 0); });
    state.cats = cats.map(function (o) { return { id: o.id, name: String(o.name || ''), color: Number(o.color) || 0, order: o.order || 0 }; });
    state.books = books.map(function (o) {
      if (o.blob) blobs[o.id] = o.blob;
      return { id: o.id, title: String(o.title || 'كتاب بلا عنوان'), categoryId: String(o.categoryId || ''), size: Number(o.size) || 0, addedAt: Number(o.addedAt) || 0 };
    });
    if (state.sel !== 'all' && state.sel !== 'none' && !catById(state.sel)) state.sel = 'all';
    render();
  }
  function fail() { state.failed = true; state.ready = true; render(); }

  render();
  (async function boot() {
    try {
      await Store.open();
      var cats = await Store.all('categories'), books = await Store.all('books');
      var seeded = false;
      try { seeded = localStorage.getItem('library-seeded') === '1'; } catch (e) {}
      if (!seeded && cats.length === 0 && books.length === 0) {
        var starter = ['فقه', 'بلاغة', 'جنايات'], now = Date.now();
        for (var i = 0; i < starter.length; i++) await Store.put('categories', { id: uid(), name: starter[i], color: i, order: now + i });
        try { localStorage.setItem('library-seeded', '1'); } catch (e) {}
      }
      state.canEdit = true;
      state.ready = true;
      await reload();
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    } catch (e) { fail(); }
  })();
})();
</script>

</body>
</html>
